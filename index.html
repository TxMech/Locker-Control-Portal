<!DOCTYPE html>
<html>
<head>
    <title>Pharmacy Locker Portal</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        #otp-display { font-size: 48px; font-weight: bold; color: #2c3e50; margin: 20px 0; letter-spacing: 5px; }
        button { padding: 15px 25px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; margin: 10px; }
        .gen-btn { background: #3498db; color: white; }
        .send-btn { background: #27ae60; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Pharmacy Drop-Off</h2>
        <p>Press the button to generate the pickup code:</p>
        
        <div id="otp-display">----</div>

        <button class="gen-btn" onclick="generateOTP()">Generate New Code</button>
        <br>
        <button class="send-btn" id="sendBtn" style="display:none;" onclick="sendSMS()">Send to Customer</button>
    </div>

    <script>
        let currentOTP = "";

        function generateOTP() {
            // Generate a random 4-digit number
            currentOTP = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('otp-display').innerText = currentOTP;
            
            // Show the send button
            document.getElementById('sendBtn').style.display = 'inline-block';
        }

        function sendSMS() {
            const message = encodeURIComponent(`Your Pharmacy Pickup Code is: ${currentOTP}. Please use this at the locker.`);
            // This opens the default messaging app on a phone
            window.location.href = `sms:?&body=${message}`;
        }
    </script>
</body>
</html>
