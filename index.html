<!DOCTYPE html>
<html>
<head>
    <title>Pharmacy Locker Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 40px; background: #eceff1; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; }
        h2 { color: #263238; }
        #otp-display { font-size: 60px; font-family: monospace; color: #1e88e5; margin: 25px 0; background: #f5f5f5; padding: 10px; border-radius: 10px; border: 2px dashed #bbdefb; }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 10px; margin-top: 10px; transition: 0.3s; }
        .gen-btn { background: #1e88e5; color: white; }
        .gen-btn:hover { background: #1565c0; }
        .send-btn { background: #43a047; color: white; display: none; }
        .status { margin-top: 15px; font-size: 14px; color: #757575; }
    </style>
</head>
<body>

<div class="container">
    <h2>Medicine Drop-Off</h2>
    <p>Generate a secure pickup code for the customer.</p>
    
    <div id="otp-display">----</div>

    <button class="gen-btn" onclick="generateAndSync()">Generate & Sync Code</button>
    <button class="send-btn" id="sendBtn" onclick="sendSMS()">Send SMS to Customer</button>
    
    <div class="status" id="syncStatus">Ready to generate...</div>
</div>

<script>
    // --- GITHUB CONFIG ---
    const GITHUB_TOKEN = "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";
    const REPO_OWNER = "TxMech";
    const REPO_NAME = "Locker-Control-Portal";
    const FILE_PATH = "code.txt";

    let currentOTP = "";

    async function generateAndSync() {
        const status = document.getElementById('syncStatus');
        status.innerText = "Connecting to GitHub...";
        
        currentOTP = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('otp-display').innerText = currentOTP;

        // Note: Using the API URL to fetch file info
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

        try {
            // 1. Get the current file's SHA (needed for updates)
            const getFile = await fetch(url + "?t=" + new Date().getTime(), {
                headers: { "Authorization": `token ${GITHUB_TOKEN}` }
            });

            if (getFile.status === 404) {
                throw new Error("code.txt not found in your GitHub repo. Create it manually first!");
            }

            const fileData = await getFile.json();
            
            // 2. Push the new code
            const contentEncoded = btoa(`#${currentOTP}#`);

            const response = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Update Locker Code",
                    content: contentEncoded,
                    sha: fileData.sha 
                })
            });

            if (response.ok) {
                const now = new Date().toLocaleTimeString();
                status.innerText = `✅ Sync Successful at ${now}! Locker updated.`;
                document.getElementById('sendBtn').style.display = 'block';
            } else {
                const errJson = await response.json();
                status.innerText = "❌ GitHub Error: " + errJson.message;
            }
        } catch (err) {
            status.innerText = "❌ Error: " + err.message;
        }
    }

    function sendSMS() {
        const message = encodeURIComponent(`Your Pharmacy Pickup Code is: ${currentOTP}. Use this at the locker.`);
        window.location.href = `sms:?&body=${message}`;
    }
</script>

</body>
</html>
